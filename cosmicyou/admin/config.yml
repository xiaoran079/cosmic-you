backend:
  name: turbo-github
  turbo_site_id: d08a20e2-3ffa-4bad-8fd3-eb64eaabe5fa
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: "https://cosmicyou.netlify.app"
display_url: "https://cosmicyou.netlify.app"
collections:
  - name: "posts"
    label: "Journal Articles"
    folder: "blog/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Category", name: "category", widget: "select", options: ["Career", "Love", "Self-Discovery", "Weekly Horoscope"]}
      - {label: "Publication date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "Short description", name: "excerpt", widget: "text"}
      - {label: "Cover image", name: "cover", widget: "image", required: false}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}
      - {label: "Article", name: "body", widget: "markdown"}
